# docker-compose.override.yml (gitignored or dev-only — not used in production)
services:
  backend:
    # ports:
    #   - "2000:2000"
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor

  frontend:
    ports:
      - "1000:10000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

  mysql:
    ports:
      - "127.0.0.1:3307:3306"
